# Quelle für die Metadaten im Contao Manager (contao/package-metadata).
# Änderungen hier werden in den Fork übertragen.
#
# Die deutsche Beschreibung meidet lange Zusammensetzungen wie
# „Schachturnierverwaltungen" oder „Mannschaftstabelle": Die Rechtschreibprüfung
# des Upstream-Linters kennt sie nicht, und jedes solche Wort bräuchte einen
# Eintrag in dessen Allowlist. „InsertTag" steht so geschrieben, weil die
# Allowlist diese Schreibweise führt und zeichengenau vergleicht.

de:
    title: Schachturnier-Betrachter
    description: >
        Gibt die Dateien der Programme Swiss-Chess und Swiss-Manager als
        Inhaltselement oder als InsertTag aus: die Daten des Turniers,
        Teilnehmer, Rangliste, Kreuztabelle, Fortschrittstabelle, Paarungen und
        Ergebnisse. Bei Turnieren mit Mannschaften kommen die Tabelle der
        Mannschaften, ihre Wettkämpfe und die Kreuztabelle der Mannschaften
        hinzu. Mehrere Listen erscheinen als Reiter. Läuft unter Contao 4.13 und
        Contao 5.
    keywords:
        - Schach
        - Turnier
        - Kreuztabelle
        - Rangliste
        - Swiss-Chess
        - Swiss-Manager
        - SWT

en:
    title: Chess tournament viewer
    description: >
        Displays the files of the tournament programs Swiss-Chess and
        Swiss-Manager as a content element or as an insert tag: tournament
        data, players, standings, cross table, progress table, pairings and
        results. For team tournaments, the team standings, the matches and the
        team cross table are added. Several lists are shown as tabs. Runs on
        Contao 4.13 and Contao 5.
    keywords:
        - chess
        - tournament
        - cross table
        - standings
        - Swiss-Chess
        - Swiss-Manager
        - SWT
