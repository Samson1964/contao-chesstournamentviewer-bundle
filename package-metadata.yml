# Quelle fuer die Metadaten im Contao Manager (contao/package-metadata).
# Änderungen hier werden in den Fork übertragen.

de:
    title: Schachturnier-Betrachter
    description: >
        Gibt Dateien von Schachturnierverwaltungen als Inhaltselement und als Inserttag aus:
        Turnierdaten, Teilnehmer, Rangliste, Kreuztabelle, Fortschrittstabelle,
        Paarungen und Ergebnisse, bei Mannschaftsturnieren zusätzlich
        Mannschaftstabelle, Wettkämpfe und Kreuztabelle der Mannschaften.
        Mehrere Listen erscheinen als Reiter. Erkannt werden Turnierdateien der
        Programme SwissChess und Swiss-Manager. 
        Läuft unter Contao 4.13 und Contao 5.
    keywords:
        - Schach
        - Turnier
        - Kreuztabelle
        - Rangliste
        - Swiss-Chess
        - SWT

en:
    title: Chess tournament viewer
    description: >
        Displays files of chess tournament management programs as a content
        element and a insert tag: tournament data, players, standings, cross table, progress
        table, pairings and results; for team tournaments also team standings,
        matches and the team cross table. Several lists are shown as tabs. The
        first supported format is SWT (Swiss-Chess); further formats can be
        added. Runs on Contao 4.13 and Contao 5.
    keywords:
        - chess
        - tournament
        - cross table
        - standings
        - swiss-chess
        - swt
