services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    _instanceof:
        # Jede Umsetzung der Formatschnittstelle bekommt den Tag von allein.
        # Ein neues Turnierformat braucht damit nur einen Dienst-Eintrag und
        # keine Änderung am Verzeichnis.
        Schachbulle\ContaoChesstournamentviewerBundle\Format\TurnierFormatInterface:
            tags: ['schachbulle_ctv.format']

    # --- Turnierformate ----------------------------------------------------

    Schachbulle\ContaoChesstournamentviewerBundle\Format\Swt\SwtFormat: ~

    Schachbulle\ContaoChesstournamentviewerBundle\Format\SwissManager\SwissManagerFormat: ~

    Schachbulle\ContaoChesstournamentviewerBundle\Format\FormatVerzeichnis:
        arguments:
            $formate: !tagged_iterator schachbulle_ctv.format

    # --- Turnierdaten ------------------------------------------------------

    Schachbulle\ContaoChesstournamentviewerBundle\Turnier\TurnierLader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Schachbulle\ContaoChesstournamentviewerBundle\Liste\ListenBauer: ~

    # Baut aus gespeicherten Einstellungen die fertige Ausgabe. Benutzt vom
    # Inhaltselement und vom Inserttag.
    Schachbulle\ContaoChesstournamentviewerBundle\Liste\TurnierAusgabe: ~

    Schachbulle\ContaoChesstournamentviewerBundle\Liste\InserttagAusgabe:
        arguments:
            $logger: '@monolog.logger.contao.error'

    # --- Rückrufe des Data Containers --------------------------------------

    # Der Tag hängt an `target` selbsttätig `_callback` an; daraus werden
    # `config.onload_callback`, `fields.ctvFormat.options_callback` und so
    # fort. Die Schreibweise ist in Contao 4.13 und Contao 5 dieselbe.
    #
    # Dieselbe Klasse bedient zwei Tabellen: das Inhaltselement in
    # `tl_content` und die Inserttags in `tl_ctv_inserttag`. Deshalb steht sie
    # hier zweimal, mit verschiedenen Argumenten.
    Schachbulle\ContaoChesstournamentviewerBundle\EventListener\MaskeListener:
        arguments:
            $tabelle: 'tl_content'
            $palette: 'chesstournamentviewer'
            $typ: 'chesstournamentviewer'
        tags:
            - name: contao.callback
              table: tl_content
              target: config.onload
              method: setzeDateiendungen
            - name: contao.callback
              table: tl_content
              target: config.onload
              method: passeMaskeAn
            - name: contao.callback
              table: tl_content
              target: fields.ctvFormat.options
              method: formatOptionen
            - name: contao.callback
              table: tl_content
              target: fields.ctvListe.options
              method: listenOptionen
            - name: contao.callback
              table: tl_content
              target: fields.ctvStand.options
              method: standOptionen
            - name: contao.callback
              table: tl_content
              target: fields.ctvRunden.options
              method: rundenOptionen
            - name: contao.callback
              table: tl_content
              target: fields.ctvMannschaftswahl.options
              method: mannschaftOptionen
            - name: contao.callback
              table: tl_content
              target: fields.ctvSpalten.options
              method: spaltenOptionen
            - name: contao.callback
              table: tl_content
              target: fields.ctvSpalten.load
              method: spaltenVorauswahl
            - name: contao.callback
              table: tl_content
              target: fields.ctvDatei.load
              method: pruefeUploadTypen

    schachbulle_ctv.maske.inserttag:
        class: Schachbulle\ContaoChesstournamentviewerBundle\EventListener\MaskeListener
        arguments:
            $tabelle: 'tl_ctv_inserttag'
            $palette: 'default'
            $typ: ''
        tags:
            - name: contao.callback
              table: tl_ctv_inserttag
              target: config.onload
              method: setzeDateiendungen
            - name: contao.callback
              table: tl_ctv_inserttag
              target: config.onload
              method: passeMaskeAn
            - name: contao.callback
              table: tl_ctv_inserttag
              target: fields.ctvFormat.options
              method: formatOptionen
            - name: contao.callback
              table: tl_ctv_inserttag
              target: fields.ctvListe.options
              method: listenOptionen
            - name: contao.callback
              table: tl_ctv_inserttag
              target: fields.ctvStand.options
              method: standOptionen
            - name: contao.callback
              table: tl_ctv_inserttag
              target: fields.ctvRunden.options
              method: rundenOptionen
            - name: contao.callback
              table: tl_ctv_inserttag
              target: fields.ctvMannschaftswahl.options
              method: mannschaftOptionen
            - name: contao.callback
              table: tl_ctv_inserttag
              target: fields.ctvSpalten.options
              method: spaltenOptionen
            - name: contao.callback
              table: tl_ctv_inserttag
              target: fields.ctvSpalten.load
              method: spaltenVorauswahl
            - name: contao.callback
              table: tl_ctv_inserttag
              target: fields.ctvDatei.load
              method: pruefeUploadTypen

    Schachbulle\ContaoChesstournamentviewerBundle\EventListener\TlCtvInserttagListener:
        tags:
            - name: contao.callback
              table: tl_ctv_inserttag
              target: list.label.label
              method: beschriftung
            - name: contao.callback
              table: tl_ctv_inserttag
              target: fields.alias.save
              method: kennung

    # --- Frontend ----------------------------------------------------------

    Schachbulle\ContaoChesstournamentviewerBundle\Controller\ContentElement\TurnierBetrachterController:
        arguments:
            # Der Dienst hat in keiner der beiden Contao-Fassungen einen Alias
            # auf den Klassennamen und muss deshalb über die Dienst-ID kommen.
            $tokenChecker: '@contao.security.token_checker'
            $logger: '@monolog.logger.contao.error'
        tags:
            - name: contao.content_element
              category: schach
              type: chesstournamentviewer
              template: ce_chesstournamentviewer

    # Die beiden Hüllen, die mehrere Ausgaben zu Reitern zusammenfassen. Sie
    # stehen zusätzlich in TL_WRAPPERS, damit Contao die eingeschlossenen
    # Elemente im Backend einrückt.
    Schachbulle\ContaoChesstournamentviewerBundle\Controller\ContentElement\UmschlagAnfangController:
        tags:
            - name: contao.content_element
              category: schach
              type: chesstournamentviewerStart
              template: ce_chesstournamentviewerStart

    Schachbulle\ContaoChesstournamentviewerBundle\Controller\ContentElement\UmschlagEndeController:
        tags:
            - name: contao.content_element
              category: schach
              type: chesstournamentviewerStop
              template: ce_chesstournamentviewerStop

    # Den Inserttag `{{ctv::…}}` meldet die DI-Erweiterung an: Contao 5 kennt
    # dafür eine eigene Schnittstelle, Contao 4.13 nur den alten Hook. Beide
    # zugleich würden die Ausgabe verdoppeln.
